services:
  web:
    build: ./docker
    container_name: crafted_web
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: crafted
      DB_USER: crafted_user
      DB_PASS: crafted_pass
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: crafted_db
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: crafted
      MYSQL_USER: crafted_user
      MYSQL_PASSWORD: crafted_pass
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      # La primera vez que arranca, MySQL ejecuta estos scripts en orden.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: crafted_pma
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
